# gclear 1.2.4 — configuration (optional tuning).
#
# The shipped default is generic and identical everywhere; local projects may
# tune it (copying the skill directory is enough to upgrade). Paths and credentials
# are NEVER configured here: they are derived at runtime from the skill
# directory, TELEGRAM_STATE_DIR and $ROOT/.env so that copying the skill
# directory is enough. Any GCLEAR_* key may be overridden by an environment
# variable of the same name (environment wins).

# ── shared ────────────────────────────────────────────────────────────────
GCLEAR_BUSY_TIMEOUT=300          # max seconds to wait for a stable idle window
GCLEAR_IDLE_STABLE=10            # seconds an idle reading must stay stable
GCLEAR_POLL_INTERVAL=3           # poll cadence
GCLEAR_INTERRUPT_ENABLE=1        # 1 = try to interrupt after busy timeout
GCLEAR_INTERRUPT_GRACE=5         # seconds to wait after an interrupt attempt
GCLEAR_INTERRUPT_ATTEMPTS=2      # normal-mode interrupt attempts
GCLEAR_NOTIFY_FALLBACK=1         # 1 = send fallback guidance to Telegram
GCLEAR_NOTIFY_DRYRUN=0           # 1 = log only, never send

# ── clear ─────────────────────────────────────────────────────────────────
GCLEAR_CLEAR_CONFIRM=60          # seconds to confirm /clear created a new session
GCLEAR_CLEAR_LATE=300            # extra late window before a safe single resend
GCLEAR_CLEAR_RETRIES=1           # extra attempts (total = retries + 1)
GCLEAR_MINIMAL_NOTIFY=0          # 1 = minimal Telegram text
GCLEAR_CLEAR_MESSAGE=""          # optional override for the clear-step notice
GCLEAR_CLEAR_FAILURE=""          # optional override for the clear-failure notice

# ── inject ────────────────────────────────────────────────────────────────
GCLEAR_INJECT_CONFIRM=180        # seconds to observe the marker in the target SID
GCLEAR_INJECT_RETRIES=1          # retries only after an explicit session-busy rc=2

# ── model switch ──────────────────────────────────────────────────────────
GCLEAR_MODEL_CONFIRM=60          # seconds to confirm /model applied
GCLEAR_MODEL_RETRIES=1

# ── budget ────────────────────────────────────────────────────────────────
GCLEAR_TOTAL_BUDGET=1500         # normal-mode internal budget (seconds)

# ── supervised (external supervisor; see SKILL.md) ──────────────────────
# The external GCLEAR_DEADLINE (<=900) is authoritative and is never rewritten.
# These only bound gclear's internal phase planning.
GCLEAR_SUPERVISED_PHASE_CAP=840
GCLEAR_SUPERVISED_INTERRUPT_ATTEMPTS=1
GCLEAR_SUPERVISED_CLEAR_LATE=180
GCLEAR_SUPERVISED_INJECT_CONFIRM=120
GCLEAR_SUPERVISED_MODEL_CONFIRM=0

# ── model aliases (optional, per project) ────────────────────────────────
# Shipped default is empty (fully generic). Override per project as needed:
# space-separated k=v alias=full-model-id pairs. Full IDs starting with
# "claude-" pass through without mapping; anything unmapped is treated as a
# dynamic target (switch attempted, result reported by the receipt).
# Example:
#   MODEL_ALIASES="best=<full-model-id> sonnet=<full-model-id>"
MODEL_ALIASES=""
